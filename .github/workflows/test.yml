# Runs the full test suite on push/PR — the audit's §4.2 gap (no CI, so the JS
# suites only ran when someone remembered the manual loop). The JS aggregator
# (tests/js/run-all.js) exits non-zero on any failing file, and dotnet test fails
# on any failing xUnit test, so a red commit fails the job.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: C# suite
        # Weaver.csproj pins RuntimeIdentifier=win-x64 + SelfContained=true (the shipped
        # desktop artifact). A plain `dotnet test` then builds a self-contained win-x64 app
        # whose runtimeconfig has no framework entry — the Linux testhost cannot launch it
        # ("libhostpolicy.so not found"). Override both for the TEST build only: a
        # framework-dependent linux-x64 build runs under the runner's installed .NET.
        run: dotnet test --nologo -p:RuntimeIdentifier=linux-x64 -p:SelfContained=false

      - name: JS client-logic suite
        run: node tests/js/run-all.js
